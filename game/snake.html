<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon Snake — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #05060f; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: "DejaVu Sans Mono", monospace; color: #e8fff2; }
  #hud { width: 960px; display: flex; justify-content: space-between; align-items: baseline;
         padding: 0 4px 10px; }
  #title { font-size: 30px; font-weight: bold; letter-spacing: 6px; color: #39ff88;
           text-shadow: 0 0 18px #39ff88; }
  #score { font-size: 30px; font-weight: bold; color: #ffe14d; text-shadow: 0 0 14px #ffe14d; }
  #hint { font-size: 16px; color: #8fa3bf; letter-spacing: 2px; }
  canvas { background: #070a18; border: 2px solid #1de9b6; border-radius: 12px;
           box-shadow: 0 0 42px rgba(29, 233, 182, .45), inset 0 0 60px rgba(29, 233, 182, .08); }
  #over { position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%);
          font-size: 44px; font-weight: bold; color: #ff5470; text-shadow: 0 0 24px #ff5470;
          display: none; text-align: center; letter-spacing: 4px; }
</style>
</head>
<body>
<div id="hud">
  <span id="title">NEON SNAKE</span>
  <span id="hint">ARROW KEYS TO PLAY</span>
  <span id="score">SCORE 0</span>
</div>
<canvas id="game" width="960" height="600"></canvas>
<div id="over">GAME OVER<br><span style="font-size:22px;color:#e8fff2">PRESS R TO RESTART</span></div>
<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var CELL = 30, COLS = 32, ROWS = 20;
  var snake, dir, pending, food, score, alive, timer;

  function reset() {
    snake = [{ x: 16, y: 10 }, { x: 15, y: 10 }, { x: 14, y: 10 }, { x: 13, y: 10 }];
    dir = { x: 1, y: 0 }; pending = dir;
    score = 0; alive = true;
    document.getElementById('over').style.display = 'none';
    document.getElementById('score').textContent = 'SCORE 0';
    placeFood();
    clearInterval(timer);
    timer = setInterval(tick, 110);
    draw();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
  }

  function tick() {
    if (!alive) return;
    dir = pending;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      alive = false;
      clearInterval(timer);
      document.getElementById('over').style.display = 'block';
      draw();
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      document.getElementById('score').textContent = 'SCORE ' + score;
      placeFood();
      if (score % 50 === 0) { clearInterval(timer); timer = setInterval(tick, Math.max(70, 110 - score / 5)); }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#070a18';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(29,233,182,0.07)';
    ctx.lineWidth = 1;
    for (var gx = 1; gx < COLS; gx++) { ctx.beginPath(); ctx.moveTo(gx * CELL, 0); ctx.lineTo(gx * CELL, canvas.height); ctx.stroke(); }
    for (var gy = 1; gy < ROWS; gy++) { ctx.beginPath(); ctx.moveTo(0, gy * CELL); ctx.lineTo(canvas.width, gy * CELL); ctx.stroke(); }
    // food: pulsing neon orb
    var pulse = 10 + Math.sin(Date.now() / 180) * 3;
    ctx.fillStyle = '#ff5470';
    ctx.shadowColor = '#ff5470'; ctx.shadowBlur = 26;
    ctx.beginPath(); ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, pulse, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // snake: neon green body, glowing head
    snake.forEach(function (seg, i) {
      var t = 1 - i / snake.length;
      ctx.fillStyle = i === 0 ? '#b6ffd6' : 'rgb(57,' + Math.floor(200 + 55 * t) + ',136)';
      ctx.shadowColor = '#39ff88'; ctx.shadowBlur = i === 0 ? 26 : 14;
      roundRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4, 8);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  var KEYS = { ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
               ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 } };
  window.addEventListener('keydown', function (e) {
    if (KEYS[e.key]) {
      var next = KEYS[e.key];
      if (!(next.x === -dir.x && next.y === -dir.y)) pending = next;
      e.preventDefault();
    } else if (e.key === 'r' || e.key === 'R') {
      reset();
    }
  });

  // State exposed so a driver (or a test) can read the live game.
  window.NEON_SNAKE = {
    state: function () {
      return { snake: snake.map(function (s) { return { x: s.x, y: s.y }; }),
               food: { x: food.x, y: food.y }, dir: { x: dir.x, y: dir.y },
               score: score, alive: alive, cols: COLS, rows: ROWS };
    },
    reset: reset
  };

  reset();
})();
</script>
</body>
</html>
